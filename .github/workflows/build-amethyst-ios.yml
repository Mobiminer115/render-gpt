name: Build Amethyst iOS on GitHub macOS

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: amethyst-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  build-ios:
    name: Build iOS IPA (GitHub-hosted macOS)
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout renderer workspace
        uses: actions/checkout@v4

      - name: Checkout Amethyst iOS source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-iOS
          ref: f98c4133c72d39e06ceac42b57cc4477c52105fc
          path: amethyst
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        run: |
          # macos-15 ARM64 images include CMake; use prebuilt Homebrew bottles.
          cmake --version
          brew install --force-bottle ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          gmake --version
          ldid -h >/dev/null 2>&1 || true

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Verify toolchain
        id: verify-toolchain
        working-directory: amethyst
        run: |
          echo "BOOTJDK=$JAVA_HOME/bin" >> "$GITHUB_ENV"
          command -v gmake
          command -v cmake
          command -v ldid
          "$JAVA_HOME/bin/javac" -version
          "$JAVA_HOME/bin/java" -version
          test -f Makefile
          test -d Amethyst.xcodeproj
          uname -m
          cmake --version
          mkdir -p "$RUNNER_TEMP/amethyst-logs"

      - name: Patch missing Mach headers in upstream checkout
        working-directory: amethyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Natives/JavaLauncher.m")
          s = p.read_text()
          anchor = '#include <unistd.h>\n'
          needed = '#include <mach/mach.h>\n#include <mach/mach_init.h>\n#include <mach/task.h>\n'
          if needed not in s:
              if anchor not in s:
                  raise SystemExit("Could not locate include insertion point in Natives/JavaLauncher.m")
              s = s.replace(anchor, anchor + needed, 1)
              p.write_text(s)
          print("Mach headers present:")
          for line in p.read_text().splitlines():
              if "mach/mach" in line or "mach/task" in line:
                  print(line)
          PY

      - name: Build standard iOS IPA
        id: build-standard
        working-directory: amethyst
        env:
          SLIMMED: "0"
        run: |
          set -o pipefail
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 2>&1 | tee "$RUNNER_TEMP/amethyst-logs/standard-ipa.log"

      - name: Build TrollStore-entitled TIPA
        id: build-trollstore
        working-directory: amethyst
        env:
          SLIMMED: "0"
        run: |
          set -o pipefail
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 2>&1 | tee "$RUNNER_TEMP/amethyst-logs/trollstore-tipa.log"

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: amethyst
        run: |
          {
            echo "=== Runner ==="
            uname -a || true
            echo "=== Xcode ==="
            xcodebuild -version || true
            echo "=== CMake ==="
            cmake --version || true
            echo "=== GNU Make ==="
            gmake --version || true
            echo "=== Java ==="
            java -version || true
            echo "=== Build outputs ==="
            find artifacts -maxdepth 3 -type f -print 2>/dev/null || true
            echo "=== CMake diagnostics ==="
            find Natives/build -type f \( -name 'CMakeError.log' -o -name 'CMakeOutput.log' \) 2>/dev/null | while read -r f; do
              echo "--- $f"
              tail -n 120 "$f"
            done
            echo "=== Compiler failures ==="
            grep -R -n -E "error:|fatal error:|undefined reference|ld: error" "$RUNNER_TEMP/amethyst-logs" 2>/dev/null || true
          } > "$RUNNER_TEMP/amethyst-logs/diagnostics.txt" 2>&1
          cat "$RUNNER_TEMP/amethyst-logs/diagnostics.txt"
          {
            echo "## Amethyst CI failure report"
            echo ""
            echo "- Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Standard IPA: ${{ steps.build-standard.outcome || 'not-run' }}"
            echo "- TrollStore TIPA: ${{ steps.build-trollstore.outcome || 'not-run' }}"
            echo ""
            echo "### Compiler errors"
            grep -R -n -E "error:|fatal error:|undefined reference|ld: error" "$RUNNER_TEMP/amethyst-logs" 2>/dev/null | tail -n 60 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ci-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/amethyst-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iOS packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-baseline-${{ github.run_number }}
          path: |
            amethyst/artifacts/*.ipa
            amethyst/artifacts/*.tipa
            amethyst/artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: error
          retention-days: 14

      - name: Update PR with failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          STANDARD_STATUS: ${{ steps.build-standard.outcome || 'not-run' }}
          TROLLSTORE_STATUS: ${{ steps.build-trollstore.outcome || 'not-run' }}
          VERIFY_STATUS: ${{ steps.verify-toolchain.outcome || 'not-run' }}
        with:
          script: |
            const marker = '<!-- render-gpt-amethyst-ci-status -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('No pull request context; skipping PR comment.');
              return;
            }
            const details = [
              `- Toolchain verification: **${process.env.VERIFY_STATUS}**`,
              `- Standard IPA: **${process.env.STANDARD_STATUS}**`,
              `- TrollStore TIPA: **${process.env.TROLLSTORE_STATUS}**`
            ].join('\n');
            const body = [
              marker,
              '## Amethyst iOS CI needs attention',
              '',
              'The automated macOS build failed. Diagnostics are attached to the workflow run when available.',
              '',
              details,
              '',
              `- [Open workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              `- Diagnostic artifact: \`amethyst-ci-diagnostics-${context.runNumber}\` (if upload succeeded)`,
              '',
              'The workflow will run again automatically after the next PR update.'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
